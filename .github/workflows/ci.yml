name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A push to claude/** and the pull_request event for the PR that push opens
# both fire on the same commit. The push run is the one that counts (a PR
# opened by GITHUB_TOKEN raises no pull_request event at all, so push is the
# only trigger a fresh branch gets), so the PR run is skipped for those
# branches and kept for PRs raised by hand from other branch names.

jobs:
  backend:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requirements.txt is what Railway installs. pyproject.toml lists only a
      # subset of it, so installing the package alone leaves out python-dotenv,
      # PyJWT and stripe, and the whole suite errors on import.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app scripts tests server.py

      - name: Format check
        run: ruff format --check app scripts tests server.py

      - name: Type check
        run: mypy app/

      - name: Tests
        run: python -m unittest discover -s tests

  frontend:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  ios:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    # Must carry the same Xcode the app is developed against: the native code
    # calls iOS 26 APIs (`glassEffect`, `sharedBackgroundVisibility`) that are
    # absent from the SDK on macos-15, where the newest Xcode is 16.4.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Xcode target copies public/, capacitor.config.json and config.xml
      # as resources, and all three are generated rather than tracked, so the
      # build fails without a copy step. `cap copy` writes them; `cap sync` is
      # avoided because it also rewrites Package.swift and fails on this
      # renamed project.
      - name: Build web assets
        run: |
          npm ci
          npm run build
          npx cap copy ios
        working-directory: frontend

      - name: Report the toolchain
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -project big3.me.xcodeproj \
            -scheme big3.me \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: frontend/ios/App
