name: CI

# Push only, every branch. There is deliberately no `pull_request` trigger.
#
# A push to claude/** and the pull_request event for the PR that push opens
# fire on the same commit, and the push run is the one that counts: branch
# protection matches required checks by name against the head SHA, and the
# push run is on that SHA. The PR run was pure duplicate.
#
# Worse, it was a duplicate that reported failure. The three jobs used to carry
# `if: github.event_name != 'pull_request' || !startsWith(github.head_ref,
# 'claude/')` to skip it, but a job-level `if` is evaluated only once the run
# has created its jobs, and this run is racing the auto-merge. When the merge
# lands first the branch and `refs/pull/N/merge` are gone, GitHub cannot
# resolve the workflow for the run, and it ends with zero jobs and a red
# "workflow file issue" — three of them in one evening, each one needing to be
# ruled out by hand. There is no head-branch filter for the `pull_request`
# trigger, so the only way to not lose that race is to not enter it.
#
# The cost is that a PR from a fork gets no checks, since a fork's push does
# not run here. This repository has none.

on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requirements.txt is what Railway installs. pyproject.toml lists only a
      # subset of it, so installing the package alone leaves out python-dotenv,
      # PyJWT and stripe, and the whole suite errors on import.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app scripts tests server.py

      - name: Format check
        run: ruff format --check app scripts tests server.py

      - name: Type check
        run: mypy app/

      - name: Tests
        run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  ios:
    # Must carry the same Xcode the app is developed against: the native code
    # calls iOS 26 APIs (`glassEffect`, `sharedBackgroundVisibility`) that are
    # absent from the SDK on macos-15, where the newest Xcode is 16.4.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Xcode target copies public/, capacitor.config.json and config.xml
      # as resources, and all three are generated rather than tracked, so the
      # build fails without a copy step. `cap copy` writes them; `cap sync` is
      # avoided because it also rewrites Package.swift and fails on this
      # renamed project.
      - name: Build web assets
        run: |
          npm ci
          npm run build
          npx cap copy ios
        working-directory: frontend

      - name: Report the toolchain
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -project big3.me.xcodeproj \
            -scheme big3.me \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: frontend/ios/App
